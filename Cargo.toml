[workspace]
members = [
  "crates/chat-history-core",
  "crates/chat-history-cli",
  "crates/chat-history-mcp",
]
resolver = "2"

[workspace.package]
edition = "2024"
version = "0.4.0"
license = "MIT"
authors = ["David Beveridge"]

[workspace.dependencies]
anyhow = "1.0"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
clap = { version = "4.5", features = ["derive", "env"] }
axum = "0.8"
hex = "0.4"
fastembed = { version = "=7.1.0", default-features = false, features = ["hf-hub-rustls-tls", "ort-download-binaries-rustls-tls"] }
regex = "1.12"
reqwest = { version = "0.12", default-features = false, features = ["charset", "http2", "json", "rustls-tls"] }
rmcp = { version = "1.5.0", features = ["macros", "server", "transport-io", "schemars"] }
rusqlite = { version = "0.39", features = ["backup", "bundled", "functions"] }
schemars = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tempfile = "3.14"
tokio = { version = "1.48", features = ["macros", "rt-multi-thread", "signal", "time", "process"] }
tokio-util = "0.7"
tower = "0.5"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
zip = "4.6"
zstd = "0.13"
